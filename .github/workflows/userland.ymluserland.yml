name: userland

# Builds the ios-sweet iOS userland helpers (userland/build.sh) and Mesa's OSMesa
# for the EAGL shim (userland/mesa/mk-mesa.sh) on GitHub's macOS runners, which
# is the only environment with `xcrun --sdk iphoneos clang`.
#
# Products (artifact `sweet-userland`):
#   sweet-bbd, libsweet-bbd.dylib, sweet-autorun, wland, libsweet-gl.dylib,
#   libsweet-glapp.dylib, libOSMesa.8.dylib, gl.xml, exported-gl.txt
#
# Install them on the phone by writing them into the iOS root image; see
# _vm/step30_stage2_root.py in the replication workspace.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label (macos-15 arm64 / macos-15-intel x64)
        default: macos-15-intel
  push:
    branches: [main]
    paths:
      - "userland/**"
      - ".github/workflows/userland.ymluserland.yml"

jobs:
  build:
    # macos-14 was retired on 2026-11-02. The arm64 free pool runs out of
    # capacity often ("The job was not acquired by Runner of type hosted"),
    # hence the runner input and the intel default.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install bison jq || true
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          bison --version | head -1
          xcrun --sdk iphoneos --show-sdk-path

      - name: Local fix, keep the Bluetooth UART drained during a firmware download
        run: |
          # guacamole replication, 2026-11-18: btuart.c's download() collects the
          # controller's events into uint8_t ev[4096] and then calls
          # drain(ev + evn, sizeof(ev) - evn). Once evn reaches the buffer size,
          # drain() returns at once ("max - got < 4"), the RX FIFO backs up, the
          # controller holds CTS and uart_write() dies with
          # "uart: TX FIFO stuck (CTS held?)" after ~26 of 926 segments.
          # Nothing downstream reads those bytes during the rampatch upload, so
          # reuse the buffer instead of starving the FIFO, and report how many
          # event bytes had arrived when a segment fails.
          echo '' | base64 -d > /tmp/btuart-fix.py
          python3 /tmp/btuart-fix.py
          grep -n -A3 'keep the FIFO drained' userland/bt/btuart.c

      - name: Mesa OSMesa (freedreno + softpipe) for the EAGL shim
        continue-on-error: true
        run: |
          set -x
          bash userland/mesa/mk-mesa.sh 2>&1 | tail -40
          ls -l userland/mesa/build/out || true

      - name: userland helpers (keep going, collect every target that builds)
        continue-on-error: true
        run: |
          set -x
          sed -i '' 's/^set -e$/# set -e (CI keeps going)/' userland/build.sh || true
          bash userland/build.sh 2>&1 | tail -40
          ls -l userland/out || true

      - name: Collect
        if: always()
        run: |
          mkdir -p stage
          cp -R userland/out/. stage/ 2>/dev/null || true
          mkdir -p stage/mesa
          cp -R userland/mesa/build/out/. stage/mesa/ 2>/dev/null || true
          ls -la stage stage/mesa || true
          (cd stage && shasum -a 256 *) > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweet-userland
          path: |
            stage/
            SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
